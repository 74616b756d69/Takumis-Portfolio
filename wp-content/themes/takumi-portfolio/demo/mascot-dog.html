<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot Dog</title>
<style>
  /* ===== デモページ用（組み込み時は不要） ===== */
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #faf9f6; }
  .stage { width: min(78vw, 380px); }

  /* ===== ここから下がマスコット本体 ===== */
  .dog {
    display: block; width: 100%; height: auto; overflow: visible;

    /* ---- 毛色。写真に合わせて、青寄りのグレーではなく
           茶色みを含んだ暗いチャコールにしている ---- */
    --fur:      #6b6158;   /* 体のベース */
    --fur-dark: #3d372f;   /* 陰・後ろ側（黒に近い焦げ茶） */
    --fur-lite: #94897c;   /* 明るい面・マズル（グレージュ） */
    --ink:      #221e19;   /* 輪郭線 */

    /* ---- 差し色（耳の内側と影に使うポップなグラデーション） ---- */
    --pop-1: #ff6fb5;
    --pop-2: #9a6bff;
    --pop-3: #ffb36b;

    /* ---- 線の太さ・モーション ---- */
    --stroke: 7;
    --breathe: 4.2s;   /* 呼吸 */
    --blink: 6.2s;     /* 瞬き */
    --ear: 5.4s;       /* 耳の揺らぎ */
    --tail: 3.4s;      /* しっぽ */
  }

  .dog * { stroke-linecap: round; stroke-linejoin: round; }
  .line  { fill: none; stroke: var(--ink); stroke-width: var(--stroke); }
  .solid { stroke: var(--ink); stroke-width: var(--stroke); }

  /* グラデーションの色（属性では var() が効かないため CSS で指定） */
  .dog .s-p1 { stop-color: var(--pop-1); }
  .dog .s-p2 { stop-color: var(--pop-2); }
  .dog .s-p3 { stop-color: var(--pop-3); }
  .dog .s-f1 { stop-color: var(--fur-lite); }
  .dog .s-f2 { stop-color: var(--fur); }
  .dog .s-f3 { stop-color: var(--fur-dark); }

  /* 動きは役割ごとに g を分ける
     （SVGの transform 属性はCSSの transform に上書きされるため） */
  .breathe, .head, .eye, .ear, .tail, .curl {
    transform-box: fill-box; transform-origin: 50% 50%;
  }

  .breathe { animation: breathe var(--breathe) ease-in-out infinite; }
  .head    { transform-origin: 50% 86%; animation: head-idle 7.8s ease-in-out infinite; }
  .tail    { transform-origin: 8% 92%;  animation: tail var(--tail) ease-in-out infinite; }

  /* 耳は付け根を軸に、風を受けているようにゆっくり揺らす */
  .ear--l { transform-origin: 94% 5%; animation: ear var(--ear) ease-in-out infinite; }
  .ear--r { transform-origin: 6% 5%; animation: ear var(--ear) ease-in-out infinite reverse;
            animation-duration: calc(var(--ear) * 1.23); }

  .eye    { animation: blink var(--blink) infinite; }
  .eye--r { animation-delay: -0.05s; }

  /* 呼吸は上下だけでなく、横にわずかに膨らませると寝ている感じが出る */
  @keyframes breathe {
    0%, 100% { transform: translateY(0)    scale(1, 1); }
    50%      { transform: translateY(-4px) scale(1.012, 0.99); }
  }
  @keyframes head-idle {
    0%, 100% { transform: rotate(-1.6deg); }
    50%      { transform: rotate(1.6deg); }
  }
  @keyframes ear {
    0%, 100% { transform: rotate(-3.5deg); }
    50%      { transform: rotate(4.5deg); }
  }
  @keyframes tail {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(9deg); }
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.06); }
    98%           { transform: scaleY(1); }
  }

  /* ---- 表情の切り替え ---- */
  .blush, .tongue { opacity: 0; transition: opacity .2s ease; }

  /* ---- ホバー：頭をかしげて、しっぽを速く振る ---- */
  .dog:hover .head   { animation: head-tilt .7s ease-out forwards; }
  .dog:hover .tail   { animation-duration: .5s; }
  .dog:hover .ear--l,
  .dog:hover .ear--r { animation-duration: 1.4s; }
  .dog:hover .blush,
  .dog:hover .tongue { opacity: 1; }

  @keyframes head-tilt {
    to { transform: rotate(-11deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .dog *, .dog *:hover { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <!-- ===================== ここから下をコピーして使えます ===================== -->
  <svg class="dog" viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="香箱座りをしている愛犬のイラスト">
    <defs>
      <linearGradient id="dog-body" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0"    class="s-f1"/>
        <stop offset="0.55" class="s-f2"/>
        <stop offset="1"    class="s-f3"/>
      </linearGradient>
      <linearGradient id="dog-head" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0" class="s-f1"/>
        <stop offset="1" class="s-f2"/>
      </linearGradient>
      <linearGradient id="dog-ear" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" class="s-p1"/>
        <stop offset="1" class="s-p2"/>
      </linearGradient>
      <linearGradient id="dog-shadow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   class="s-p2"/>
        <stop offset="0.5" class="s-p1"/>
        <stop offset="1"   class="s-p3"/>
      </linearGradient>
    </defs>

    <!-- 影。差し色のグラデーションをここに効かせる -->
    <ellipse cx="160" cy="250" rx="120" ry="16" fill="url(#dog-shadow)" opacity="0.3"/>

    <g class="breathe">

      <!-- しっぽ（体の後ろから覗く） -->
      <g class="tail">
        <path class="solid" fill="url(#dog-body)"
              d="M268,214 q32,2 32,-22 q0,-17 -16,-15 q-12,2 -10,14 q1,8 9,7"/>
      </g>

      <!-- 体：伏せた低くて横に広いかたまり。これが香箱座りの土台になる -->
      <path class="solid" fill="url(#dog-body)"
            d="M40,242 C40,172 88,140 160,140 C232,140 280,172 280,242 Z"/>

      <!-- 巻き毛：描き込まず、ウェーブのラインを数本だけ添える -->
      <path class="line" stroke-width="5.5" opacity=".55" d="M62,214 q13,-11 26,0 t26,0"/>
      <path class="line" stroke-width="5.5" opacity=".55" d="M206,210 q13,-11 26,0 t26,0"/>
      <path class="line" stroke-width="5"   opacity=".45" d="M70,180 q12,-10 24,0 t24,0"/>
      <path class="line" stroke-width="5"   opacity=".45" d="M204,176 q12,-10 24,0 t24,0"/>

      <!-- 香箱座り：前足を体の下にたたみ、先だけが前に覗いている -->
      <path class="solid" fill="url(#dog-head)" d="M106,242 q0,-28 27,-28 q27,0 27,28 Z"/>
      <path class="solid" fill="url(#dog-head)" d="M160,242 q0,-28 27,-28 q27,0 27,28 Z"/>
      <path class="line" stroke-width="4" d="M133,242 v-13 M187,242 v-13"/>

      <g class="head">

        <!-- 垂れ耳（チワワ寄りに少し大きめ）。肩のあたりまで垂れる -->
        <g class="ear ear--l">
          <path class="solid" fill="url(#dog-body)"
                d="M120,80 C92,74 66,96 62,132 C58,168 74,192 96,188
                   C112,185 120,166 122,140 C124,116 124,94 120,80 Z"/>
          <path fill="url(#dog-ear)" opacity=".85"
                d="M120,98 C100,96 84,114 81,138 C78,162 88,178 102,175
                   C112,173 118,158 119,138 C120,120 121,106 120,98 Z"/>
        </g>
        <g class="ear ear--r">
          <path class="solid" fill="url(#dog-body)"
                d="M200,80 C228,74 254,96 258,132 C262,168 246,192 224,188
                   C208,185 200,166 198,140 C196,116 196,94 200,80 Z"/>
          <path fill="url(#dog-ear)" opacity=".85"
                d="M200,98 C220,96 236,114 239,138 C242,162 232,178 218,175
                   C208,173 202,158 201,138 C200,120 199,106 200,98 Z"/>
        </g>

        <!-- 顔 -->
        <circle class="solid" cx="160" cy="104" r="54" fill="url(#dog-head)"/>

        <!-- 頭の巻き毛。丸い山を並べて毛質だけ見せる -->
        <path class="solid" fill="url(#dog-head)"
              d="M116,76 a15,15 0 0 1 19,-14 a17,17 0 0 1 25,-9 a17,17 0 0 1 25,9 a15,15 0 0 1 19,14 Z"/>
        <path class="line" stroke-width="4.5" opacity=".5" d="M128,86 q11,-9 22,0 t22,0"/>

        <!-- ほっぺ（ホバーで出る） -->
        <ellipse class="blush" cx="120" cy="122" rx="12" ry="7.5" fill="url(#dog-ear)"/>
        <ellipse class="blush" cx="200" cy="122" rx="12" ry="7.5" fill="url(#dog-ear)"/>

        <!-- 目 -->
        <g class="eye eye--l">
          <ellipse cx="138" cy="102" rx="8.5" ry="10" fill="var(--ink)"/>
          <circle cx="141" cy="98" r="2.8" fill="#fff" opacity=".9"/>
        </g>
        <g class="eye eye--r">
          <ellipse cx="182" cy="102" rx="8.5" ry="10" fill="var(--ink)"/>
          <circle cx="185" cy="98" r="2.8" fill="#fff" opacity=".9"/>
        </g>

        <!-- マズルと鼻と口 -->
        <ellipse cx="160" cy="130" rx="28" ry="20" fill="var(--fur-lite)"/>
        <path d="M149,122 h22 q4,0 2,4 l-9,9 q-4,4 -8,0 l-9,-9 q-2,-4 2,-4 Z" fill="var(--ink)"/>
        <path class="line" stroke-width="5" d="M160,137 v6 M160,143 q-9,9 -16,1 M160,143 q9,9 16,1"/>

        <!-- 舌（ホバーで出る） -->
        <path class="tongue" d="M152,147 h16 q0,16 -8,16 q-8,0 -8,-16 Z" fill="url(#dog-ear)"/>
      </g>

    </g>
  </svg>
  <!-- ===================== ここまで ===================== -->
</div>

</body>
</html>
