<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot Cloud</title>
<style>
  /* ===== デモページ用（組み込み時は不要） ===== */
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #faf9f6; }
  .stage { width: min(74vw, 360px); }

  /* ===== ここから下がマスコット本体 ===== */
  .mascot {
    display: block; width: 100%; height: auto; overflow: visible;

    --c1:   #6ec3ff;   /* 雲 */
    --c2:   #ff3d7f;   /* ほっぺ */
    --c3:   #0ae4a1;   /* 雨つぶ */
    --ink:  #15161a;

    --stroke: 8;
    --breathe: 3.8s;
    --drift: 6.4s;
    --blink: 5.8s;
  }

  .mascot * { stroke-linecap: round; stroke-linejoin: round; }
  .line  { fill: none; stroke: var(--ink); stroke-width: var(--stroke); }
  .solid { stroke: var(--ink); stroke-width: var(--stroke); }

  .drift, .breathe, .eye, .drop {
    transform-box: fill-box; transform-origin: 50% 50%;
  }
  .drift   { animation: drift var(--drift) ease-in-out infinite; }
  .breathe { animation: breathe var(--breathe) ease-in-out infinite; }
  .eye     { animation: blink var(--blink) infinite; }
  .eye--r  { animation-delay: -0.04s; }

  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    93%           { transform: scaleY(0.07); }
    96%           { transform: scaleY(1); }
  }
  /* 雲なので「呼吸」は横にふくらむ動きにすると雲らしくなる */
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.035, 0.97); }
  }
  @keyframes drift {
    0%, 100% { transform: translate(-9px, 4px); }
    50%      { transform: translate(9px, -6px); }
  }

  /* ---- 雨つぶ：待機中は隠れていて、ホバーで降りだす ---- */
  .drop { opacity: 0; }
  .mascot:hover .drop    { animation: rain 1.1s ease-in infinite; }
  .mascot:hover .drop--2 { animation-delay: .36s; }
  .mascot:hover .drop--3 { animation-delay: .72s; }
  @keyframes rain {
    0%   { opacity: 0; transform: translateY(-14px) scale(.6); }
    25%  { opacity: 1; transform: translateY(0)     scale(1); }
    100% { opacity: 0; transform: translateY(54px)  scale(.9); }
  }

  /* ---- 表情の切り替え ---- */
  .eye-happy, .blush { opacity: 0; transition: opacity .18s ease; }
  .eye, .mouth--idle { transition: opacity .18s ease; }

  .mascot:hover .breathe   { animation-duration: 1.6s; }   /* わくわくして呼吸が速くなる */
  .mascot:hover .eye       { opacity: 0; }
  .mascot:hover .eye-happy { opacity: 1; }
  .mascot:hover .blush     { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .mascot *, .mascot *:hover { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <!-- ===================== ここから下をコピーして使えます ===================== -->
  <svg class="mascot" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="雲のマスコット">
    <g class="drift">
      <g class="breathe">

        <!-- 雲本体 -->
        <path class="solid" fill="var(--c1)"
              d="M52,166
                 Q30,164 30,140 Q30,118 54,114
                 Q52,74 92,66 Q126,60 142,88
                 Q178,80 190,112 Q212,120 210,142 Q208,164 186,166 Z"/>

        <!-- ほっぺ -->
        <ellipse class="blush" cx="82" cy="140" rx="12" ry="7" fill="var(--c2)"/>
        <ellipse class="blush" cx="158" cy="140" rx="12" ry="7" fill="var(--c2)"/>

        <!-- 目 -->
        <g class="eye eye--l"><circle cx="100" cy="124" r="10" fill="var(--ink)"/></g>
        <g class="eye eye--r"><circle cx="140" cy="124" r="10" fill="var(--ink)"/></g>
        <!-- ホバー時の目（にっこり） -->
        <path class="eye-happy line" d="M90,128 q10,-13 20,0" stroke-width="6"/>
        <path class="eye-happy line" d="M130,128 q10,-13 20,0" stroke-width="6"/>

        <!-- 口 -->
        <path class="line mouth--idle" d="M106,146 q14,14 28,0" stroke-width="6"/>

      </g>

      <!-- 雨つぶ（ホバーで降る） -->
      <g transform="translate(84 182)">
        <g class="drop drop--1">
          <path d="M0,-12 q11,12 0,12 q-11,0 0,-12 Z" fill="var(--c3)" stroke="var(--ink)" stroke-width="5"/>
        </g>
      </g>
      <g transform="translate(120 190)">
        <g class="drop drop--2">
          <path d="M0,-12 q11,12 0,12 q-11,0 0,-12 Z" fill="var(--c3)" stroke="var(--ink)" stroke-width="5"/>
        </g>
      </g>
      <g transform="translate(156 182)">
        <g class="drop drop--3">
          <path d="M0,-12 q11,12 0,12 q-11,0 0,-12 Z" fill="var(--c3)" stroke="var(--ink)" stroke-width="5"/>
        </g>
      </g>

    </g>
  </svg>
  <!-- ===================== ここまで ===================== -->
</div>

</body>
</html>
