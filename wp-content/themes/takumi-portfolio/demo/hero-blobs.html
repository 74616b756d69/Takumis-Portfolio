<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Blobs</title>
<style>
  /* ===== デモページ用（コピー時は不要） ===== */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background:
      linear-gradient(135deg, #fdfcff 0%, #f2f5ff 50%, #fff7fb 100%);
  }
  .hero { width: min(92vw, 900px); aspect-ratio: 16 / 10; }

  /* ===== ここから下がブロブ本体 ===== */
  .blobs {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;

    /* ---- カラー設定：ここだけ差し替えれば配色が変わります ---- */
    --color-primary:      #7c5cff;   /* blob 1 */
    --color-primary-2:    #22d3ee;
    --color-secondary:    #ff5c8a;   /* blob 2 */
    --color-secondary-2:  #ffb86b;
    --color-accent:       #34e0a1;   /* blob 3 */
    --color-accent-2:     #6ec3ff;

    /* ---- 質感・モーション設定 ---- */
    --blob-opacity: 0.92;   /* 全体の濃さ */
    --blob-overlap: 0.86;   /* ブロブ同士の重なりの透け具合 */
    --morph-duration: 18s;  /* 変形の周期 */
    --float-duration: 14s;  /* 浮遊の周期 */
  }

  .blobs__layer { opacity: var(--blob-opacity); }

  /* グラデーションの色は CSS 側で指定（属性では var() が効かないため） */
  #grad-primary   .stop-a { stop-color: var(--color-primary); }
  #grad-primary   .stop-b { stop-color: var(--color-primary-2); }
  #grad-secondary .stop-a { stop-color: var(--color-secondary); }
  #grad-secondary .stop-b { stop-color: var(--color-secondary-2); }
  #grad-accent    .stop-a { stop-color: var(--color-accent); }
  #grad-accent    .stop-b { stop-color: var(--color-accent-2); }

  .blob path {
    opacity: var(--blob-overlap);
    animation: morph var(--morph-duration) ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }
  .blob__float {
    animation: float var(--float-duration) ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  /* --- blob 1 --- */
  .blob--1 .blob__float { animation-duration: calc(var(--float-duration) * 1);    animation-delay: 0s; }
  .blob--1 path         { animation-duration: calc(var(--morph-duration) * 1);    animation-delay: 0s;    fill: url(#grad-primary); }
  @keyframes morph {
    0%, 100% { d: path("M92.3,0.0 C92.7,21.9 72.7,50.0 53.4,67.0 C34.2,84.0 -2.0,107.3 -23.3,102.1 C-44.6,96.9 -63.4,60.2 -74.6,35.9 C-85.8,11.7 -99.4,-22.3 -90.5,-43.6 C-81.5,-64.8 -44.5,-88.1 -20.9,-91.5 C2.7,-95.0 32.4,-79.5 51.3,-64.3 C70.1,-49.0 91.9,-21.9 92.3,0.0 Z"); }
    33%      { d: path("M99.3,0.0 C96.2,25.1 70.9,48.0 50.8,63.6 C30.6,79.3 -0.6,98.7 -21.5,94.1 C-42.4,89.5 -65.6,57.6 -74.5,35.9 C-83.5,14.2 -84.0,-14.6 -75.1,-36.2 C-66.3,-57.8 -45.5,-85.2 -21.4,-93.7 C2.7,-102.2 49.3,-102.7 69.5,-87.1 C89.6,-71.5 102.4,-25.1 99.3,0.0 Z"); }
    66%      { d: path("M84.7,0.0 C81.7,26.8 73.1,52.3 55.2,69.2 C37.2,86.1 3.5,104.3 -23.1,101.2 C-49.7,98.1 -93.1,74.6 -104.5,50.3 C-116.0,26.1 -105.7,-20.4 -91.8,-44.2 C-77.9,-68.1 -48.6,-84.8 -21.2,-92.7 C6.3,-100.6 55.4,-107.0 73.0,-91.6 C90.7,-76.1 87.7,-26.8 84.7,0.0 Z"); }
  }

  /* --- blob 2 --- */
  .blob--2 .blob__float { animation-name: float-2; animation-duration: calc(var(--float-duration) * 1.35); animation-delay: -4s; }
  .blob--2 path         { animation-name: morph-2; animation-duration: calc(var(--morph-duration) * 1.22); animation-delay: -6s; fill: url(#grad-secondary); }
  @keyframes morph-2 {
    0%, 100% { d: path("M75.3,31.9 C64.1,58.8 51.8,101.4 30.4,108.4 C9.0,115.4 -33.9,91.2 -53.2,73.8 C-72.5,56.5 -85.0,27.0 -85.4,4.2 C-85.8,-18.7 -72.7,-47.7 -55.8,-63.4 C-38.9,-79.2 -9.5,-92.0 16.0,-90.3 C41.6,-88.6 87.7,-73.3 97.5,-53.0 C107.4,-32.6 86.5,5.0 75.3,31.9 Z"); }
    33%      { d: path("M80.0,33.8 C72.6,56.8 51.1,89.9 27.5,98.3 C4.0,106.8 -40.7,100.2 -61.0,84.6 C-81.2,69.0 -93.1,31.3 -94.1,4.6 C-95.0,-22.1 -84.7,-61.4 -66.6,-75.6 C-48.5,-89.9 -8.8,-87.2 14.4,-81.1 C37.6,-75.1 61.4,-58.4 72.3,-39.3 C83.3,-20.1 87.5,10.9 80.0,33.8 Z"); }
    66%      { d: path("M80.9,34.2 C72.2,58.5 51.4,94.7 28.6,102.0 C5.7,109.3 -36.2,94.3 -56.2,78.0 C-76.3,61.8 -89.9,30.3 -91.8,4.5 C-93.7,-21.3 -85.7,-60.1 -67.6,-76.8 C-49.5,-93.5 -7.7,-101.2 17.0,-95.7 C41.6,-90.2 69.7,-65.3 80.3,-43.6 C91.0,-22.0 89.5,9.9 80.9,34.2 Z"); }
  }

  /* --- blob 3 --- */
  .blob--3 .blob__float { animation-name: float-3; animation-duration: calc(var(--float-duration) * 1.7); animation-delay: -9s; }
  .blob--3 path         { animation-name: morph-3; animation-duration: calc(var(--morph-duration) * 1.48); animation-delay: -11s; fill: url(#grad-accent); }
  @keyframes morph-3 {
    0%, 100% { d: path("M76.8,79.1 C56.7,98.4 12.0,111.2 -13.5,105.7 C-39.0,100.3 -62.6,69.9 -76.3,46.4 C-90.0,22.9 -103.0,-11.5 -95.6,-35.0 C-88.1,-58.6 -57.9,-84.9 -31.6,-94.9 C-5.4,-104.9 38.5,-109.1 61.7,-95.0 C84.8,-81.0 104.7,-39.5 107.2,-10.5 C109.7,18.5 96.9,59.7 76.8,79.1 Z"); }
    33%      { d: path("M63.3,65.2 C44.5,86.2 7.8,119.8 -14.8,116.3 C-37.4,112.7 -59.7,68.8 -72.2,43.9 C-84.7,19.0 -96.3,-8.5 -90.0,-33.0 C-83.8,-57.5 -57.2,-96.7 -34.4,-103.2 C-11.6,-109.7 24.6,-87.6 46.7,-72.0 C68.8,-56.4 95.4,-32.5 98.1,-9.6 C100.9,13.3 82.2,44.2 63.3,65.2 Z"); }
    66%      { d: path("M56.8,58.5 C36.9,77.6 11.7,104.8 -13.3,104.6 C-38.3,104.3 -79.5,80.0 -93.2,56.7 C-106.9,33.4 -105.1,-7.7 -95.6,-35.0 C-86.0,-62.4 -60.1,-100.5 -35.9,-107.5 C-11.6,-114.5 26.4,-93.3 50.0,-77.1 C73.6,-60.9 104.8,-33.0 105.9,-10.4 C107.0,12.2 76.7,39.3 56.8,58.5 Z"); }
  }

  /* ---- 浮遊：0% と 100% を同一値にしてシームレスにループ ---- */
  @keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    25%      { transform: translate(14px, -18px) rotate(4deg) scale(1.04); }
    50%      { transform: translate(-6px, -30px) rotate(-3deg) scale(0.97); }
    75%      { transform: translate(-16px, -12px) rotate(2deg) scale(1.02); }
  }
  @keyframes float-2 {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    25%      { transform: translate(-18px, 14px) rotate(-5deg) scale(1.05); }
    50%      { transform: translate(8px, 26px) rotate(3deg) scale(0.96); }
    75%      { transform: translate(20px, 10px) rotate(-2deg) scale(1.01); }
  }
  @keyframes float-3 {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    25%      { transform: translate(10px, 20px) rotate(3deg) scale(0.98); }
    50%      { transform: translate(24px, -8px) rotate(-4deg) scale(1.06); }
    75%      { transform: translate(6px, -22px) rotate(2deg) scale(1.01); }
  }

  /* ---- モーション低減設定を尊重（静止した状態で表示） ---- */
  @media (prefers-reduced-motion: reduce) {
    .blob path, .blob__float { animation: none !important; }
  }
</style>
</head>
<body>

<div class="hero">

  <!-- ===================== ここから下をコピーして使えます ===================== -->
  <svg class="blobs" viewBox="0 0 800 500" role="presentation" aria-hidden="true"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="grad-primary" x1="0" y1="0" x2="1" y2="1">
        <stop class="stop-a" offset="0%"/>
        <stop class="stop-b" offset="100%"/>
      </linearGradient>
      <linearGradient id="grad-secondary" x1="0" y1="1" x2="1" y2="0">
        <stop class="stop-a" offset="0%"/>
        <stop class="stop-b" offset="100%"/>
      </linearGradient>
      <linearGradient id="grad-accent" x1="0.1" y1="0" x2="0.9" y2="1">
        <stop class="stop-a" offset="0%"/>
        <stop class="stop-b" offset="100%"/>
      </linearGradient>

      <!-- ふちをやわらかく。背景は透過のまま。かたさは stdDeviation の数値で調整 -->
      <filter id="soften" x="-40%" y="-40%" width="180%" height="180%"
              color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="10"/>
      </filter>
    </defs>

    <g class="blobs__layer" filter="url(#soften)">
      <g class="blob blob--1" transform="translate(245 215) scale(1.7)">
        <g class="blob__float"><path d="M92.3,0.0 C92.7,21.9 72.7,50.0 53.4,67.0 C34.2,84.0 -2.0,107.3 -23.3,102.1 C-44.6,96.9 -63.4,60.2 -74.6,35.9 C-85.8,11.7 -99.4,-22.3 -90.5,-43.6 C-81.5,-64.8 -44.5,-88.1 -20.9,-91.5 C2.7,-95.0 32.4,-79.5 51.3,-64.3 C70.1,-49.0 91.9,-21.9 92.3,0.0 Z"/></g>
      </g>

      <g class="blob blob--2" transform="translate(575 285) scale(1.85)">
        <g class="blob__float"><path d="M75.3,31.9 C64.1,58.8 51.8,101.4 30.4,108.4 C9.0,115.4 -33.9,91.2 -53.2,73.8 C-72.5,56.5 -85.0,27.0 -85.4,4.2 C-85.8,-18.7 -72.7,-47.7 -55.8,-63.4 C-38.9,-79.2 -9.5,-92.0 16.0,-90.3 C41.6,-88.6 87.7,-73.3 97.5,-53.0 C107.4,-32.6 86.5,5.0 75.3,31.9 Z"/></g>
      </g>

      <g class="blob blob--3" transform="translate(455 135) scale(1.25)">
        <g class="blob__float"><path d="M76.8,79.1 C56.7,98.4 12.0,111.2 -13.5,105.7 C-39.0,100.3 -62.6,69.9 -76.3,46.4 C-90.0,22.9 -103.0,-11.5 -95.6,-35.0 C-88.1,-58.6 -57.9,-84.9 -31.6,-94.9 C-5.4,-104.9 38.5,-109.1 61.7,-95.0 C84.8,-81.0 104.7,-39.5 107.2,-10.5 C109.7,18.5 96.9,59.7 76.8,79.1 Z"/></g>
      </g>
    </g>
  </svg>
  <!-- ===================== ここまで ===================== -->

</div>

</body>
</html>
