<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot Robot</title>
<style>
  /* ===== デモページ用（組み込み時は不要） ===== */
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #faf9f6; }
  .stage { width: min(70vw, 340px); }

  /* ===== ここから下がマスコット本体 ===== */
  .mascot {
    display: block; width: 100%; height: auto; overflow: visible;

    /* ---- カラー ---- */
    --c1:   #ff3d7f;   /* 本体 */
    --c2:   #ffcf2d;   /* アクセント */
    --c3:   #0ae4a1;   /* アンテナ・差し色 */
    --ink:  #15161a;   /* 輪郭線 */
    --face: #ffffff;   /* 顔の下地 */

    /* ---- 線の太さ・モーション ---- */
    --stroke: 8;
    --breathe: 3.2s;   /* 呼吸 */
    --sway: 5.1s;      /* 揺れ */
    --blink: 4.8s;     /* 瞬き */
  }

  .mascot * { stroke-linecap: round; stroke-linejoin: round; }
  .line { fill: none; stroke: var(--ink); stroke-width: var(--stroke); }
  .solid { stroke: var(--ink); stroke-width: var(--stroke); }

  /* 役割ごとにgを分ける（回転と移動が衝突しないように） */
  .sway, .hop, .breathe, .eye, .antenna, .arm {
    transform-box: fill-box; transform-origin: 50% 50%;
  }
  .sway    { animation: sway var(--sway) ease-in-out infinite; }
  .breathe { animation: breathe var(--breathe) ease-in-out infinite; }
  .antenna { transform-origin: 50% 100%; animation: antenna 2.4s ease-in-out infinite; }
  .arm--l  { transform-origin: 100% 50%; animation: arm 3.7s ease-in-out infinite; }
  .arm--r  { transform-origin: 0% 50%;   animation: arm 3.7s ease-in-out infinite reverse; animation-delay: -1.1s; }

  /* 瞬き：ほとんどの時間は開いていて、一瞬だけ閉じる */
  .eye { animation: blink var(--blink) infinite; }
  .eye--r { animation-delay: -0.06s; }   /* 左右をわずかにずらすと生っぽくなる */

  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    93%           { transform: scaleY(0.08); }
    96%           { transform: scaleY(1); }
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-7px) scale(1.015); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-2.2deg); }
    50%      { transform: rotate(2.2deg); }
  }
  @keyframes antenna {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(7deg); }
  }
  @keyframes arm {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-12deg); }
  }

  /* ---- 表情の切り替え ---- */
  .mouth--hover, .blush { opacity: 0; transition: opacity .2s ease; }
  .mouth--idle { transition: opacity .2s ease; }

  /* ---- ホバー：ぴょんと跳ねて笑顔になる ---- */
  .mascot:hover .hop { animation: hop .62s cubic-bezier(.3, 1.5, .5, 1); }
  .mascot:hover .mouth--idle  { opacity: 0; }
  .mascot:hover .mouth--hover { opacity: 1; }
  .mascot:hover .blush        { opacity: 1; }
  .mascot:hover .antenna      { animation-duration: .5s; }
  .mascot:hover .arm          { animation-duration: .5s; animation-timing-function: ease-out;
                                animation-iteration-count: 1; animation-fill-mode: forwards; }
  .mascot:hover .arm--l       { animation-name: arm-up; }
  .mascot:hover .arm--r       { animation-name: arm-up-r; animation-direction: normal; }

  @keyframes hop {
    0%   { transform: translateY(0)     scaleX(1)    scaleY(1); }
    25%  { transform: translateY(6px)   scaleX(1.08) scaleY(0.92); }  /* 沈み込み */
    55%  { transform: translateY(-34px) scaleX(0.95) scaleY(1.06); }  /* 伸びる */
    80%  { transform: translateY(3px)   scaleX(1.05) scaleY(0.96); }
    100% { transform: translateY(0)     scaleX(1)    scaleY(1); }
  }
  @keyframes arm-up   { to { transform: rotate(52deg); } }
  @keyframes arm-up-r { to { transform: rotate(-52deg); } }

  @media (prefers-reduced-motion: reduce) {
    .mascot *, .mascot *:hover { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <!-- ===================== ここから下をコピーして使えます ===================== -->
  <svg class="mascot" viewBox="0 0 240 250" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="ロボットのマスコット">
    <g class="sway">
     <g class="hop">
      <g class="breathe">

        <!-- 脚 -->
        <path class="line" d="M98,232 V244 M142,232 V244"/>

        <!-- 胴体 -->
        <rect class="solid" x="78" y="180" width="84" height="54" rx="22" fill="var(--c2)"/>

        <!-- 腕 -->
        <g class="arm arm--l"><path class="line" d="M78,204 H50"/></g>
        <g class="arm arm--r"><path class="line" d="M162,204 H190"/></g>

        <!-- アンテナ -->
        <g class="antenna">
          <path class="line" d="M120,62 V30"/>
          <circle class="solid" cx="120" cy="21" r="11" fill="var(--c3)"/>
        </g>

        <!-- 耳 -->
        <rect class="solid" x="26" y="104" width="20" height="44" rx="10" fill="var(--c2)"/>
        <rect class="solid" x="194" y="104" width="20" height="44" rx="10" fill="var(--c2)"/>

        <!-- 頭 -->
        <rect class="solid" x="42" y="60" width="156" height="122" rx="34" fill="var(--c1)"/>
        <!-- 顔の下地 -->
        <rect class="solid" x="62" y="80" width="116" height="84" rx="24" fill="var(--face)"/>

        <!-- ほっぺ（ホバーで出る） -->
        <ellipse class="blush" cx="78" cy="134" rx="9" ry="6" fill="var(--c1)"/>
        <ellipse class="blush" cx="162" cy="134" rx="9" ry="6" fill="var(--c1)"/>

        <!-- 目 -->
        <g class="eye eye--l"><circle cx="96" cy="112" r="11" fill="var(--ink)"/></g>
        <g class="eye eye--r"><circle cx="144" cy="112" r="11" fill="var(--ink)"/></g>

        <!-- 口：待機時 -->
        <path class="line mouth--idle" d="M104,140 q16,13 32,0"/>
        <!-- 口：ホバー時（にっと開く） -->
        <path class="mouth--hover" d="M100,136 h40 a20,20 0 0 1 -40,0 Z"
              fill="var(--ink)" stroke="var(--ink)" stroke-width="8"/>

      </g>
     </g>
    </g>
  </svg>
  <!-- ===================== ここまで ===================== -->
</div>

</body>
</html>
