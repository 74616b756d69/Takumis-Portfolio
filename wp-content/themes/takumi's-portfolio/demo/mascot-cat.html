<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot Cat</title>
<style>
  /* ===== デモページ用（組み込み時は不要） ===== */
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #faf9f6; }
  .stage { width: min(70vw, 340px); }

  /* ===== ここから下がマスコット本体 ===== */
  .mascot {
    display: block; width: 100%; height: auto; overflow: visible;

    --c1:   #ffcf2d;   /* 体 */
    --c2:   #ff3d7f;   /* 耳の内側・鼻・ほっぺ */
    --c3:   #0ae4a1;   /* 首輪 */
    --ink:  #15161a;

    --stroke: 8;
    --breathe: 3.6s;
    --sway: 6.2s;
    --blink: 5.4s;
  }

  .mascot * { stroke-linecap: round; stroke-linejoin: round; }
  .line  { fill: none; stroke: var(--ink); stroke-width: var(--stroke); }
  .solid { stroke: var(--ink); stroke-width: var(--stroke); }

  .sway, .hop, .breathe, .eye, .ear, .tail, .head, .whisker {
    transform-box: fill-box; transform-origin: 50% 50%;
  }
  .sway    { animation: sway var(--sway) ease-in-out infinite; }
  .breathe { animation: breathe var(--breathe) ease-in-out infinite; }
  .head    { transform-origin: 50% 100%; animation: head-tilt 7.3s ease-in-out infinite; }
  .tail    { transform-origin: 0% 100%;  animation: tail 2.9s ease-in-out infinite; }
  .ear--l  { transform-origin: 50% 100%; animation: ear 4.4s ease-in-out infinite; animation-delay: -1.3s; }
  .ear--r  { transform-origin: 50% 100%; animation: ear 4.4s ease-in-out infinite reverse; }

  .eye    { animation: blink var(--blink) infinite; }
  .eye--r { animation-delay: -0.05s; }

  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(0.06); }
    97%           { transform: scaleY(1); }
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-5px) scale(1.02); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.8deg); }
    50%      { transform: rotate(1.8deg); }
  }
  @keyframes head-tilt {
    0%, 100% { transform: rotate(-3.5deg); }
    50%      { transform: rotate(3.5deg); }
  }
  @keyframes tail {
    0%, 100% { transform: rotate(-9deg); }
    50%      { transform: rotate(14deg); }
  }
  @keyframes ear {
    0%, 82%, 100% { transform: rotate(0deg); }
    88%           { transform: rotate(-11deg); }   /* たまにピクッと動く */
    94%           { transform: rotate(4deg); }
  }

  /* ---- 表情の切り替え ---- */
  .eye-happy, .blush { opacity: 0; transition: opacity .18s ease; }
  .eye, .mouth--idle { transition: opacity .18s ease; }

  /* ---- ホバー：跳ねて、目を細めて「にっこり」 ---- */
  .mascot:hover .hop        { animation: hop .7s cubic-bezier(.3, 1.5, .5, 1); }
  .mascot:hover .eye        { opacity: 0; }
  .mascot:hover .eye-happy  { opacity: 1; }
  .mascot:hover .blush      { opacity: 1; }
  .mascot:hover .tail       { animation-duration: .7s; }   /* しっぽを速く振る */
  .mascot:hover .ear--l,
  .mascot:hover .ear--r     { animation-duration: 1.1s; }

  @keyframes hop {
    0%   { transform: translateY(0)     scaleX(1)    scaleY(1); }
    22%  { transform: translateY(8px)   scaleX(1.10) scaleY(0.90); }
    55%  { transform: translateY(-30px) scaleX(0.94) scaleY(1.07); }
    80%  { transform: translateY(4px)   scaleX(1.05) scaleY(0.96); }
    100% { transform: translateY(0)     scaleX(1)    scaleY(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mascot *, .mascot *:hover { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <!-- ===================== ここから下をコピーして使えます ===================== -->
  <svg class="mascot" viewBox="0 0 240 250" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="猫のマスコット">
    <g class="sway">
     <g class="hop">
      <g class="breathe">

        <!-- しっぽ（太い線の上に細い線を重ねて「輪郭線つき」に見せる） -->
        <g class="tail">
          <path d="M162,206 q46,2 40,-46" fill="none" stroke="var(--ink)" stroke-width="22"/>
          <path d="M162,206 q46,2 40,-46" fill="none" stroke="var(--c1)" stroke-width="8"/>
        </g>

        <!-- 体 -->
        <path class="solid" d="M62,214 q0,-52 58,-52 q58,0 58,52 Z" fill="var(--c1)"/>
        <!-- 前足 -->
        <ellipse class="solid" cx="92" cy="210" rx="17" ry="11" fill="var(--c1)"/>
        <ellipse class="solid" cx="148" cy="210" rx="17" ry="11" fill="var(--c1)"/>

        <g class="head">
          <!-- 耳 -->
          <g class="ear ear--l">
            <path class="solid" d="M70,72 L62,26 L106,48 Z" fill="var(--c1)"/>
            <path d="M78,66 L74,42 L94,53 Z" fill="var(--c2)"/>
          </g>
          <g class="ear ear--r">
            <path class="solid" d="M170,72 L178,26 L134,48 Z" fill="var(--c1)"/>
            <path d="M162,66 L166,42 L146,53 Z" fill="var(--c2)"/>
          </g>

          <!-- 顔 -->
          <circle class="solid" cx="120" cy="112" r="64" fill="var(--c1)"/>

          <!-- ひげ -->
          <path class="line" d="M52,104 H28 M52,120 H30" stroke-width="5"/>
          <path class="line" d="M188,104 H212 M188,120 H210" stroke-width="5"/>

          <!-- ほっぺ（ホバーで出る） -->
          <ellipse class="blush" cx="80" cy="128" rx="11" ry="7" fill="var(--c2)"/>
          <ellipse class="blush" cx="160" cy="128" rx="11" ry="7" fill="var(--c2)"/>

          <!-- 目：待機時 -->
          <g class="eye eye--l"><ellipse cx="97" cy="106" rx="9" ry="12" fill="var(--ink)"/></g>
          <g class="eye eye--r"><ellipse cx="143" cy="106" rx="9" ry="12" fill="var(--ink)"/></g>
          <!-- 目：ホバー時（にっこり） -->
          <path class="eye-happy line" d="M87,110 q10,-14 20,0"/>
          <path class="eye-happy line" d="M133,110 q10,-14 20,0"/>

          <!-- 鼻と口 -->
          <path d="M113,126 h14 l-7,9 Z" fill="var(--c2)"/>
          <path class="line" d="M120,135 q-9,11 -18,2 M120,135 q9,11 18,2" stroke-width="6"/>
        </g>

        <!-- 首輪 -->
        <path class="solid" d="M84,166 q36,20 72,0" fill="none" stroke-width="12"/>
        <path d="M84,166 q36,20 72,0" fill="none" stroke="var(--c3)" stroke-width="6"/>

      </g>
     </g>
    </g>
  </svg>
  <!-- ===================== ここまで ===================== -->
</div>

</body>
</html>
